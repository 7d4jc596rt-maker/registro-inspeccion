<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#006aa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspección">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Registro de actuaciones · Inspección educativa</title>
<link rel="stylesheet" href="css/app.css?v=4.3">
</head>
<body>
<div id="gate" class="gate">
 <div class="gate-card">
  <div class="gate-head"><div class="gate-seal" aria-hidden="true"></div><h1>Registro de actuaciones</h1><p>Inspección educativa, curso 2026/27</p></div>
  <div id="gateBody" class="gate-body"><div class="gate-working" role="status"><span class="spinner" aria-hidden="true"></span>Cargando…</div></div>
 </div>
 <p class="gate-foot">Los datos se guardan cifrados con AES-256. Sin tu contraseña no se pueden leer.<br><span id="appVersion"></span></p>
 <input id="gFile" type="file" hidden>
</div>
<div class="app" id="appShell" hidden>
<aside class="side">
  <div class="brand">Registro de actuaciones<small>Inspección educativa · 2026/27</small></div>
  <div class="nav">
    <div class="section">Principal</div>
    <button data-view="dashboard" class="active">⌂ &nbsp; Inicio</button>
    <button data-view="centros">⌂ &nbsp; Centros</button>
    <button data-view="registro">☷ &nbsp; Actuaciones</button>
    <button data-view="visitas">◷ &nbsp; Visitas</button>
    <button data-view="seguimiento">✓ &nbsp; Seguimiento</button>
    <button data-view="consultas">§ &nbsp; Consultas y procedimientos</button>
    <button data-view="especiales">▤ &nbsp; Otros datos</button>
    <button data-view="reuniones">✎&#xFE0E; &nbsp; Notas reuniones</button>
    <button data-view="bibliografia">❏&#xFE0E; &nbsp; Bibliografía</button>
    <button data-view="contactos">☎&#xFE0E; &nbsp; Contactos</button>
    <button data-view="datos">⚙ &nbsp; Datos y seguridad</button>
  </div>
  <div class="vault" id="vaultBox">
    <div id="vaultStatus" class="vault-status" role="status" aria-live="polite"></div>
    <div class="vault-actions"><button id="vaultCloud" class="vault-btn strong" type="button" hidden></button><button id="vaultLock" class="vault-btn" type="button">Bloquear</button></div>
  </div>
</aside>
<main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><b id="modalTitle">Nueva actuación</b><button class="close" onclick="closeModal()" aria-label="Cerrar">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="modalSave">Guardar</button></div></div></div>
<div class="modal vdlg" id="vdlg" role="dialog" aria-modal="true" aria-labelledby="vdlgTitle"><div class="modalbox"><div class="modalhead"><b id="vdlgTitle"></b></div><div class="modalbody" id="vdlgBody"></div><div class="modalfoot" id="vdlgFoot"></div></div></div>
<script src="js/vault.js?v=4.3"></script>
</body></html>
