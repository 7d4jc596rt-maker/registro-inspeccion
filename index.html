   }
   const renamed=header.charAt(0).toLocaleUpperCase('es')+header.slice(1).toLocaleLowerCase('es');
   if(renamed!==header)changed=true;
   return renamed;
  });
  const drop=inferior.headers.map((header,i)=>['Columna 7','Data comunicación a ie'].includes(header)?i:-1).filter(i=>i>=0);
  if(drop.length){
   inferior.legacyCursoInferiorRemovedColumns={headers:[...inferior.headers],rows:inferior.rows.map(row=>[...row])};
   drop.reverse().forEach(i=>{

   });
   changed=true;
  }
 }
 const orientation=db.specials['Dep. Orientación'];
 if(orientation&&Array.isArray(orientation.headers)){

   orientation.rows.forEach(row=>{const c=db.centers.find(center=>String(center.code)===String(row[i]??''));if(c)row[i]=c.name});
   changed=true;
  }

  const alIndex=orientation.headers.indexOf('AL');
  orientation.headers=orientation.headers.map((header,i)=>{
   if(header==='Autorizados'){changed=true;return i<alIndex?'PTC':'ALC';}
   if(header==='PT AT.  PREFERENTE'){changed=true;return 'PTC';}
   if(header==='AL AT.  PREFERENTE'){changed=true;return 'ALC';}
   return header;
  });
  const orColumns=orientation.headers.map((header,i)=>/^O\s*R(?:\b|[-–])/i.test(header)?i:-1).filter(i=>i>=0);
  if(orColumns.length){
   orientation.legacyORColumns={headers:[...orientation.headers],rows:orientation.rows.map(row=>[...row])};
   orColumns.reverse().forEach(i=>{orientation.headers.splice(i,1);orientation.rows.forEach(row=>row.splice(i,1));});

 }

   religion.headers.splice(code,1);

  if(center>=0&&religion.headers[center]!=='CENTRO'){religion.headers[center]='CENTRO';changed=true;}
 }
 return changed;
}
function applyOrientationCatalog(){
 const m=db.specials?.['Dep. Orientación'];if(!m||m.catalog2026Applied)return false;
 const fields=['CENTRO','Unidades','PT','AL','PTC','ALC'];
 const indexes=fields.map(field=>m.headers.indexOf(field));if(indexes.some(i=>i<0))return false;
 const normalize=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/[^a-z0-9]/g,'');
 let matched=0;
 for(const [code,values] of Object.entries(ORIENTATION_CATALOG_2026)){
  const center=db.centers.find(c=>String(c.code)===code);if(!center)continue;
  let row=m.rows.find(r=>normalize(r[indexes[0]])===normalize(center.name)||String(r[indexes[0]]??'')===code);
  if(!row){row=Array(m.headers.length).fill('');m.rows.push(row);}
  row[indexes[0]]=center.name;
  values.forEach((value,i)=>{row[indexes[i+1]]=value});
  matched++;
 }
 if(!matched)return false;
 m.catalog2026Applied=true;
 m.catalog2026Source='Catalogo_Xorn_CO_26.pdf';
 return true;
}

function calendarSources(items){
 const urls=new Set([...items.map(x=>x[4]),...RELATIVE_DEADLINES.map(x=>x[3])].filter(x=>/^https?:\/\//i.test(x)));
 const groups=[['Decretos',[]],['Órdenes',[]],['Resto',[]]];
 for(const url of urls){const name=CALENDAR_SOURCE_NAMES[url]||url;const group=/^Decreto\b/i.test(name)?0:/^Orden\b/i.test(name)?1:2;groups[group][1].push(url)}
 return groups.filter(([,sources])=>sources.length).map(([heading,sources])=>`<section class="calendar-source-group"><h4>${heading}</h4><ul class="calendar-source-list">${sources.sort((a,b)=>(CALENDAR_SOURCE_PUBLICATIONS[a]||'9999-12-31').localeCompare(CALENDAR_SOURCE_PUBLICATIONS[b]||'9999-12-31')||(CALENDAR_SOURCE_NAMES[a]||a).localeCompare(CALENDAR_SOURCE_NAMES[b]||b,'es')).map(url=>`<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(CALENDAR_SOURCE_NAMES[url]||url)}</a></li>`).join('')}</ul></section>`).join('');
}
function deadlineRow(item,featured=false){const source=/^https?:\/\//i.test(item[4])?`<a href="${esc(item[4])}" target="_blank" rel="noopener noreferrer">Consultar fuente</a>`:esc(item[4]||'Sin fuente indicada');return `<div class="deadline${item[0]<calendarToday()?' overdue':''}${featured?' featured':''}"><span class="deadline-month" aria-label="Mes de vencimiento ${deadlineMonth(item[0])}">${deadlineMonth(item[0])}</span><time>${esc(item[1])}</time><div><strong>${esc(item[2])}</strong><small>${esc(item[3])} · ${source}${item[5]?` · <button class="btn small danger" onclick="deleteManualDeadline('${item[5]}')">Eliminar</button>`:''}</small></div></div>`}
function relativeRow(x){return `<div class="deadline"><span class="deadline-month" aria-label="Mes variable">VAR</span><time>${esc(x[0])}</time><div><strong>${esc(x[1])}</strong><small>${esc(x[2])} · <a href="${esc(x[3])}" target="_blank" rel="noopener noreferrer">Consultar norma</a></small></div></div>`}
function calendarToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function calendarPanel(){
 const items=calendarItems(), upcoming=items.filter(x=>x[0]>=calendarToday()), featured=new Set(upcoming.slice(0,5));
 return `<div class="panel"><div class="panelhead"><h2>Calendario de plazos · 2026/27</h2><button class="btn small primary" onclick="newManualDeadline()">+ Añadir plazo</button></div><div class="panelbody"><div class="toolbar"><input id="calendarSearch" class="input" type="search" style="flex:1" placeholder="Buscar fecha, evento, centro o norma…" aria-label="Buscar eventos en el calendario" oninput="filterCalendar()"><span class="pill">${upcoming.length} próximos</span></div><p class="muted" style="font-size:12px;margin:0 0 12px">Fechas normativas; comprueba el ámbito y los ajustes por día no lectivo. *En admisión, si el último día no es lectivo, se traslada al siguiente día lectivo.</p><div id="calendarResults"><div class="deadline-list">${upcoming.slice(0,5).map(x=>deadlineRow(x)).join('')||'<div class="empty">No quedan plazos próximos.</div>'}</div></div><div class="calendar-dropdowns"><details id="calendarMore" class="calendar-more"><summary>Ver el calendario completo (${items.length} actuaciones)</summary><div class="deadline-list">${items.map(x=>deadlineRow(x,featured.has(x))).join('')}</div><p class="muted" style="font-size:12px">Además: candidaturas al consejo escolar, mínimo 7 días naturales; documentación de baremo, 10 días hábiles tras cerrar la admisión; reclamaciones a listas provisionales, 5 días hábiles desde su publicación.</p><h3 style="font-size:14px;color:var(--accent)">Plazos periódicos y relativos</h3><div class="deadline-list">${RELATIVE_DEADLINES.map(relativeRow).join('')}</div><p class="muted" style="font-size:12px">Esta selección no abarca todas las convocatorias y enseñanzas.</p></details><details id="calendarSources" class="calendar-more"><summary>Ver fuentes de calendario</summary>${calendarSources(items)}</details></div></div></div>`;
}
function normalizeCalendarSearch(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function filterCalendar(){
 const raw=document.getElementById('calendarSearch')?.value||'', query=normalizeCalendarSearch(raw.trim());
 const box=document.getElementById('calendarResults'), more=document.getElementById('calendarMore');
 if(!box||!more)return;
 if(!query){const upcoming=calendarItems().filter(x=>x[0]>=calendarToday());box.innerHTML=`<div class="deadline-list">${upcoming.slice(0,5).map(x=>deadlineRow(x)).join('')||'<div class="empty">No quedan plazos próximos.</div>'}</div>`;more.hidden=false;return}
 const matches=calendarItems().filter(x=>normalizeCalendarSearch([x[0],x[1],x[2],x[3],x[4],deadlineMonth(x[0])].join(' ')).includes(query));
 const relative=RELATIVE_DEADLINES.filter(x=>normalizeCalendarSearch(x.join(' ')).includes(query));
 box.innerHTML=`<p class="muted" style="font-size:12px">${matches.length+relative.length} resultados</p><div class="deadline-list">${matches.map(x=>deadlineRow(x)).join('')}${relative.map(relativeRow).join('')||(!matches.length?'<div class="empty">No se encontraron eventos.</div>':'')}</div>`;
 more.hidden=true;
}
function newManualDeadline(){
 openModal('Añadir plazo',`<div class="formgrid"><div class="field"><label for="manualDate">Fecha límite *</label><input id="manualDate" type="date" class="input" required></div><div class="field"><label for="manualTitle">Actuación *</label><input id="manualTitle" class="input" style="width:100%" required maxlength="200"></div><div class="field full"><label for="manualScope">Centros o ámbito</label><input id="manualScope" class="input" style="width:100%" maxlength="200"></div><div class="field full"><label for="manualSource">Enlace a la fuente (opcional)</label><input id="manualSource" class="input" style="width:100%" type="url" placeholder="https://…"></div></div>`,()=>{
  const date=document.getElementById('manualDate').value,title=document.getElementById('manualTitle').value.trim(),scope=document.getElementById('manualScope').value.trim(),source=document.getElementById('manualSource').value.trim();
  if(!date||!title){alert('Indica la fecha límite y la actuación.');return}
  if(source&&!/^https?:\/\//i.test(source)){alert('El enlace debe empezar por https:// o http://.');return}
  if(!Array.isArray(db.manualDeadlines))db.manualDeadlines=[];
  db.manualDeadlines.push({id:uid(),date,title,scope,source});save();closeModal();dashboard();
 });
}
function deleteManualDeadline(id){if(!confirm('¿Eliminar este plazo manual?'))return;db.manualDeadlines=(db.manualDeadlines||[]).filter(x=>x.id!==id);save();dashboard()}
function filterHomeRequests(){
 const q=(document.getElementById('homeRequestSearch')?.value||'').trim().toLocaleLowerCase('es');
 const onlyPending=!!document.getElementById('homeRequestPendingOnly')?.checked;
 const rows=document.querySelectorAll('#homeRequestList .home-request-row');let visible=0;
 rows.forEach(row=>{row.hidden=(!!q&&!row.dataset.center.includes(q))||(onlyPending&&row.dataset.finished==='true');if(!row.hidden)visible++});
 const empty=document.getElementById('homeRequestNoResults');if(empty){empty.hidden=!rows.length||(!q&&!onlyPending)||visible>0;empty.textContent='No hay resultados con los filtros seleccionados.';}
}

 if(!Array.isArray(m.nonOccupied))m.nonOccupied=[];

 m.nonOccupied[rowIndex][field]=!!input.checked;save();

 if(number)number.classList.toggle('non-occupied',!!input.checked&&number.textContent.trim()!=='—');

function centerSpecialCard(c,key,title){
 const m=db.specials?.[key];if(!m)return `<div class="panel"><div class="panelbody">${esc(title)}: sin datos disponibles.</div></div>`;
 const aliases=key==='Prof. Prácticas'&&c.name==='CEIP Alfonso D. Rodríguez Castelao'?['CEIP ADR Castelao']:[];
 const norm=v=>String(v??'').trim().toLocaleLowerCase('es');
 const centerNames=[c.name,...aliases].map(norm);
 const centerColumn=key==='EOE_At.Dom_Cambio mod_Flexibili'?1:0;
 const rows=m.rows.map((row,index)=>({row,index})).filter(({row})=>centerNames.includes(norm(row[centerColumn]))||(key==='Dep. Orientación'&&String(row[0]??'').trim()===String(c.code)));
 if(key==='Días no lectivos'){
  const months=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const tiles=rows.map(({row,index})=>{
   const raw=String(row[1]||''),match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
   const month=match?months[Number(match[2])-1]:null;
   const calendar=month?`<time class="non-teaching-date" datetime="${esc(raw)}" aria-label="${esc(date(raw))}"><span class="non-teaching-month">${month}</span><span class="non-teaching-number">${match[3]}</span></time>`:`<span class="non-teaching-date"><span class="non-teaching-month">FECHA</span><span class="non-teaching-number">—</span></span>`;
   return `<div class="non-teaching-day"><button class="non-teaching-edit" type="button" aria-label="Editar día no lectivo ${month?esc(date(raw)):'sin fecha'}" title="Editar día no lectivo" onclick="editSpecialRecord('Días no lectivos',${index},'${c.id}')">${calendar}</button>${specialStatus(row[2])}</div>`;
  }).join('');
  return `<div class="panel center-extra-card special-purple"><div class="panelhead"><h3>${esc(title)} <span class="pill">${rows.length} ${rows.length===1?'registro':'registros'}</span></h3><button class="btn small primary" type="button" onclick="newSpecialRecord('Días no lectivos','${c.id}')">+ Registro</button></div><div class="panelbody"><div class="non-teaching-days">${tiles||'<div class="empty">No hay registros para este centro.</div>'}</div></div></div>`;
 }
 if(key==='Dep. Orientación'){
  const fieldIndex=name=>m.headers.indexOf(name);
  const amount=value=>{const text=String(value??'').trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(text)?Number(text):0};
  const total=(full,shared)=>rows.reduce((sum,{row})=>sum+amount(row[fieldIndex(full)])+amount(row[fieldIndex(shared)])/2,0);
  const types=[...new Set(rows.flatMap(({row})=>String(row[fieldIndex('Tipo')]??'').toUpperCase().match(/\b(?:DO|OC|CC|OO)\b/g)||[]))];
  const mismatch=fields=>rows.some(({index})=>fields.some(field=>m.catalogMismatch?.[index]?.[field]));
  const tile=(label,value,fields)=>`<button class="orientation-tile ${mismatch(fields)?'catalog-mismatch':''}" type="button" aria-label="Editar ${label} del departamento de orientación" title="Editar ${label}" onclick="editCenterOrientation('${c.id}')"><span class="non-teaching-date"><span class="non-teaching-month">${label}</span><span class="non-teaching-number">${esc(value)}</span></span></button>`;
  const format=value=>Number.isInteger(value)?String(value):String(value).replace('.',',');
  return `<div class="panel center-extra-card special-orange"><div class="panelhead"><h3>${esc(title)} <span class="pill">${rows.length} ${rows.length===1?'registro':'registros'}</span></h3><button class="btn small primary" type="button" onclick="newSpecialRecord('Dep. Orientación','${c.id}')">+ Registro</button></div><div class="panelbody">${rows.length?`<div class="orientation-tiles">${tile('Tipo',types.join(' · ')||'—',['Tipo'])}${tile('PT',format(total('PT','PTC')),['PT','PTC'])}${tile('AL',format(total('AL','ALC')),['AL','ALC'])}</div>`:'<div class="empty">No hay registros para este centro.</div>'}</div></div>`;
 }
 return `<div class="panel center-extra-card ${SPECIAL_ORANGE.has(key)?'special-orange':SPECIAL_GREEN.has(key)?'special-green':SPECIAL_PURPLE.has(key)?'special-purple':''}"><div class="panelhead"><h3>${esc(title)} <span class="pill">${rows.length} ${rows.length===1?'registro':'registros'}</span></h3><button class="btn small primary" type="button" onclick="newSpecialRecord('${key}','${c.id}')">+ Registro</button></div><div class="panelbody">${rows.map(({row,index})=>`<div class="center-extra-entry">${m.headers.map((h,i)=>/^(centro|codcentro)$/i.test(String(h||'').trim())?'':key==='Dep. Orientación'&&ORIENTATION_FIELDS.includes(h)?`<p><strong>${esc(h)}:</strong> <span class="orientation-number ${m.nonOccupied?.[index]?.[h]&&String(row[i]??'').trim()?'non-occupied':''}">${esc(row[i]||'—')}</span><label class="non-occupied-toggle"><input type="checkbox" ${m.nonOccupied?.[index]?.[h]?'checked':''} onchange="setOrientationNonOccupied(${index},'${h}',this)"> No ocupado</label></p>`:row[i]===null||row[i]===undefined||String(row[i]).trim()===''?'':`<p><strong>${esc(h||'Campo '+(i+1))}:</strong> ${esc(row[i])}</p>`).join('')}<button class="btn small" type="button" onclick="editSpecialRecord('${key}',${index},'${c.id}')">Editar</button></div>`).join('')||'<div class="empty">No hay registros para este centro.</div>'}</div></div>`;
}
function editCenterOrientation(centerId){
 const center=db.centers.find(c=>c.id===centerId),m=db.specials?.['Dep. Orientación'];if(!center||!m)return;
 const matches=m.rows.map((row,index)=>({row,index})).filter(({row})=>String(row[0]??'').trim().toLocaleLowerCase('es')===center.name.trim().toLocaleLowerCase('es')||String(row[0]??'').trim()===String(center.code));
 if(matches.length===1){editSpecialRecord('Dep. Orientación',matches[0].index,centerId);return;}
 if(!matches.length)return;
 const body=`<p>Este centro tiene varios registros. Selecciona el que quieres editar:</p><div class="orientation-record-choice">${matches.map(({row,index},i)=>`<button class="btn" type="button" onclick="closeModal();editSpecialRecord('Dep. Orientación',${index},'${centerId}')">Registro ${i+1} · ${esc(row[m.headers.indexOf('Tipo')]||'Sin tipo')}</button>`).join('')}</div>`;
 openModal('Editar departamento de orientación',body,closeModal);
 document.getElementById('modalSave').textContent='Cerrar';
}
function centerFollowupPanel(c){

}

function visitsMonthPDF(month,visits){
 // PDF autónomo: fuentes estándar y texto codificado en WinAnsi, sin conexión ni bibliotecas externas.
 const extra={8364:128,8218:130,402:131,8222:132,8230:133,8224:134,8225:135,710:136,8240:137,352:138,8249:139,338:140,381:142,8216:145,8217:146,8220:147,8221:148,8226:149,8211:150,8212:151,732:152,8482:153,353:154,8250:155,339:156,382:158,376:159};
 const encode=value=>Array.from(String(value??'').replace(/\s+/g,' ')).map(char=>{
  let n=char.codePointAt(0);if(n>255)n=extra[n]??63;
  if(n===40||n===41||n===92)return '\\'+String.fromCharCode(n);
  if(n<32)return ' ';
  return n>126?'\\'+n.toString(8).padStart(3,'0'):String.fromCharCode(n);
 }).join('');
 const wrap=(value,max)=>{
  const words=String(value||'—').replace(/\s+/g,' ').trim().split(' '),lines=[];let line='';
  for(const word of words){
   if(line&&line.length+word.length+1>max){lines.push(line);line='';}
   if(word.length>max){if(line){lines.push(line);line='';}for(let i=0;i<word.length;i+=max)lines.push(word.slice(i,i+max));}
   else line+=(line?' ':'')+word;
  }
  if(line)lines.push(line);return lines.length?lines:['—'];
 };
 const pages=[];let commands=[],y=0;
 const logo=atob(VISIT_PDF_LOGO_BASE64);
 const text=(x,yy,value,size=9)=>commands.push(`BT /F1 ${size} Tf ${x} ${yy} Td (${encode(value)}) Tj ET`);
 const start=()=>{
  commands=['q 265 0 0 33 42 545 cm /Logo Do Q'];y=510;
  const vk=[...new Set(visits.map(v=>courseOf(v.date)).filter(Boolean))];
  text(42,y,'Visitas · '+month+(vk.length===1?' · Curso '+vk[0]:''),16);y-=30;
  text(42,y,'Fecha',10);text(135,y,'Centro',10);text(370,y,'Observaciones',10);
  commands.push(`0.7 0.78 0.85 RG 42 ${y-9} m 800 ${y-9} l S`);y-=27;
 };
 start();
 for(const visit of visits){
  const center=wrap(visit.center||'Sin centro',42),observation=wrap(visit.obs||'—',88);
  const isoDate=String(visit.date||'');const dateText=/^\d{4}-\d{2}-\d{2}/.test(isoDate)?`${isoDate.slice(8,10)}/${isoDate.slice(5,7)}/${isoDate.slice(0,4)}`:isoDate;
  const count=Math.max(center.length,observation.length);let index=0;
  while(index<count){
   let available=Math.floor((y-45-18)/13);
   if(available<1){pages.push(commands.join('\n'));start();available=Math.floor((y-45-18)/13);}
   const chunk=Math.min(count-index,available),height=chunk*13+18;
   text(42,y,index?dateText+' (cont.)':dateText);
   center.slice(index,index+chunk).forEach((line,i)=>text(135,y-i*13,line));
   if(index&&index>=center.length)text(135,y,center[0]+' (cont.)');
   observation.slice(index,index+chunk).forEach((line,i)=>text(370,y-i*13,line));
   y-=height;commands.push(`0.88 0.9 0.92 RG 42 ${y+13} m 800 ${y+13} l S`);
   index+=chunk;
  }
 }
 pages.push(commands.join('\n'));
 const objects=[];
 objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
 objects[2]=`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_,i)=>`${5+i*2} 0 R`).join(' ')}] >>`;
 objects[3]=`<< /Type /XObject /Subtype /Image /Width 650 /Height 81 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${logo.length} >>\nstream\n${logo}\nendstream`;
 objects[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
 pages.forEach((stream,i)=>{
  const page=5+i*2,content=page+1;
  objects[page]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /Font << /F1 4 0 R >> /XObject << /Logo 3 0 R >> >> /Contents ${content} 0 R >>`;
  objects[content]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
 });
 let pdf='%PDF-1.4\n',offsets=[0];
 for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`;}
 const xref=pdf.length;
 pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
 return Uint8Array.from(pdf+`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`,char=>char.charCodeAt(0));

function specialRecordFields(name,m,row,prefix,centerId,rowIndex){
 const center=db.centers.find(c=>c.id===centerId);
 const codeIndex=m.headers.findIndex(h=>String(h||'').trim().toLocaleLowerCase('es')==='codcentro');
 const nameIndex=m.headers.findIndex(h=>String(h||'').trim().toLocaleLowerCase('es')==='centro');
 return m.headers.map((header,i)=>{
  const label=esc(header||('Campo '+(i+1)));
  let value=row?.[i]??'';
  if(center&&(!value)&&(i===codeIndex||i===nameIndex))value=i===codeIndex?center.code:center.name;
  if(i===codeIndex||i===nameIndex){
   const options=db.centers.map(c=>({value:String(i===codeIndex?c.code:c.name),label:c.name}));
   const selected=String(value);
   const legacy=selected&&!options.some(o=>o.value===selected)?`<option value="${esc(selected)}" selected>${esc(selected)} (dato anterior)</option>`:'';
   return `<div class="field ${m.headers.length>6?'':'full'}"><label for="${prefix}${i}">${label}</label><select id="${prefix}${i}" class="select" style="width:100%" onchange="syncSpecialCenter(this,'${prefix}',${codeIndex},${nameIndex})"><option value="" ${selected?'':'selected'}>— Seleccionar centro —</option>${legacy}${options.map(o=>`<option value="${esc(o.value)}" ${o.value===selected?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
  }
  if(name==='Días no lectivos'&&header==='Estado'){return `<div class="field"><label for="${prefix}${i}">${label}</label><select id="${prefix}${i}" class="select" style="width:100%">${NON_TEACHING_STATES.map(state=>`<option value="${esc(state)}" ${state===(value||NON_TEACHING_STATES[0])?'selected':''}>${esc(state)}</option>`).join('')}</select></div>`;}
  if((name==='Días no lectivos'&&header==='Fecha')||(name==='Prof. Prácticas'&&String(header).trim().toLocaleLowerCase('es')==='visita')||(['EscolarizaciónExtraordinarias-B','EscolarizaciónCursoInferior'].includes(name)&&['Fecha sol','Fecha res'].includes(header))){
   const parsed=String(value).match(/^\d{4}-\d{2}-\d{2}/)?.[0]||'';
   return `<div class="field ${m.headers.length>6?'':'full'}"><label for="${prefix}${i}">${label}</label><input id="${prefix}${i}" type="date" class="input" style="width:100%" value="${esc(parsed)}"></div>`;
  }
  const mismatch=name==='Dep. Orientación'&&['Tipo','PT','PTC','AL','ALC'].includes(header)?`<label class="catalog-mismatch-check"><input type="checkbox" id="${prefix}mismatch_${header}" ${m.catalogMismatch?.[rowIndex]?.[header]?'checked':''}> No coincide con el catálogo</label>`:'';
  return `<div class="field ${m.headers.length>6?'':'full'}"><label for="${prefix}${i}">${label}</label><input id="${prefix}${i}" class="input" style="width:100%" value="${esc(value)}">${mismatch}</div>`;
 }).join('');
}

 if(codeIndex<0||nameIndex<0)return;
 const c=db.centers.find(c=>String(c.code)===select.value||c.name===select.value);if(!c)return;
 const code=document.getElementById(prefix+codeIndex),name=document.getElementById(prefix+nameIndex);
 if(code)code.value=String(c.code);if(name)name.value=c.name;
}

function parseCSV(text){
 text=String(text).replace(/^\ufeff/,'');
 const first=text.split(/\r?\n/,1)[0]||'';
 const count=ch=>first.split(ch).length;
 const delim=count(';')>count(',')&&count(';')>=count('\t')?';':count('\t')>count(',')?'\t':',';
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"'&&f==='')q=true;
  else if(c===delim){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
  else f+=c;
 }
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}

const normTxt=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const cleanNotion=v=>String(v??'').replace(/\s*\((?:https?:\/\/|www\.notion)[^)]*\)/g,'').trim();
let notionImport=null;
function guessMapping(target,headers){
 const used=new Set(),map={};
 for(const [key,,syn] of IMPORT_TARGETS[target].fields){
  const i=headers.findIndex((h,idx)=>!used.has(idx)&&syn.some(s=>normTxt(h).includes(s)));
  if(i>=0){map[key]=i;used.add(i)}
 }
 return map;
}

  if(rows.length<2){alert('El CSV no tiene filas de datos.');return}
  const headers=rows[0].map(h=>String(h).trim());
  const hn=headers.map(normTxt);
  const target=hn.some(h=>h.includes('codigo'))&&!hn.some(h=>h.includes('asunto'))?'centers':'actions';
  notionImport={name:f.name,headers,rows:rows.slice(1),target,map:guessMapping(target,headers)};
  openModal('Importar '+f.name,notionImportBody(),runNotionImport);
  document.getElementById('modalSave').textContent='Importar';
 };

}

const MONTHS_ANY={enero:1,january:1,jan:1,ene:1,xaneiro:1,febrero:2,february:2,feb:2,febreiro:2,marzo:3,march:3,mar:3,abril:4,april:4,apr:4,abr:4,mayo:5,may:5,maio:5,junio:6,june:6,jun:6,xuno:6,julio:7,july:7,jul:7,xullo:7,agosto:8,august:8,aug:8,ago:8,septiembre:9,setiembre:9,september:9,sep:9,sept:9,set:9,setembro:9,octubre:10,october:10,oct:10,outubro:10,out:10,noviembre:11,november:11,nov:11,novembro:11,diciembre:12,december:12,dec:12,dic:12,decembro:12,dez:12};
function parseDateAny(raw){
 const s=normTxt(String(raw||'').split('→')[0]);if(!s)return '';
 const p=n=>String(n).padStart(2,'0');
 const ok=(y,m,d)=>{y=Number(y);m=Number(m);d=Number(d);return y>1900&&m>=1&&m<=12&&d>=1&&d<=31?`${y}-${p(m)}-${p(d)}`:''};
 let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return ok(m[1],m[2],m[3]);
 m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m)return ok(m[3].length===2?'20'+m[3]:m[3],m[2],m[1]);
 m=s.match(/^([a-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})/);if(m&&MONTHS_ANY[m[1]])return ok(m[3],MONTHS_ANY[m[1]],m[2]);
 m=s.match(/^(?:[a-z]+,?\s+)?(\d{1,2})\s+(?:de\s+)?([a-z]+)\.?,?\s+(?:de\s+)?(\d{4})/);if(m&&MONTHS_ANY[m[2]])return ok(m[3],MONTHS_ANY[m[2]],m[1]);
 return '';
}
function timeFrom(raw){
 const m=String(raw||'').split('→')[0].match(/(\d{1,2}):(\d{2})\s*([ap])?\.?\s*m?\.?/i);if(!m)return '';
 let h=Number(m[1]);const ap=(m[3]||'').toLowerCase();if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0;
 return h<24?`${String(h).padStart(2,'0')}:${m[2]}`:'';
}
function parseDone(v){return /^(s[ií]|yes|true|1|x|✓|✔|hecho|done|finaliz|complet|terminad|cerrad|resuelt|listo)/i.test(normTxt(v).replace(/^[^a-z0-9✓✔]+/,''))||/^(✓|✔)/.test(String(v).trim())}
function normMode(v){
 const n=normTxt(v);if(!n)return ['',''];
 if(/correo|mail|e-mail/.test(n))return ['Correo electrónico',''];
 if(/telef|llamad|movil|tlf/.test(n))return ['Teléfono',''];
 if(/rexel/.test(n))return ['REXEL',''];
 if(/presen|visita|reunion|entrevista/.test(n))return ['Presencial',''];
 return ['Otro',String(v).trim()];
}
function runNotionImport(){
 notionReadMap();
 const n=notionImport,map=n.map,target=n.target;
 if(!Object.keys(map).length){alert('Asigna al menos una columna.');return}
 if(target==='centers'&&map.name===undefined){alert('Asigna la columna con el nombre del centro.');return}
 if(target==='visits'&&(map.center===undefined||map.date===undefined)){alert('Para importar visitas asigna al menos el centro y la fecha.');return}
 const chk=id=>!!document.getElementById(id)?.checked;
 const createCenters=chk('niCreate'),skipDup=chk('niSkip'),addExtra=chk('niExtra'),updateCenters=chk('niUpdate');
 const get=(row,k)=>map[k]===undefined?'':cleanNotion(row[map[k]]);
 const assigned=new Set(Object.values(map));
 const extraText=row=>addExtra?n.headers.map((h,i)=>!assigned.has(i)&&cleanNotion(row[i])?`${h}: ${cleanNotion(row[i])}`:'').filter(Boolean).join('\n'):'';
 let created=0,updated=0,skipped=0,newCenters=0,badDates=0;
 const findCenter=v=>{const k=normTxt(v);return db.centers.find(c=>normTxt(c.name)===k||(c.code&&normTxt(c.code)===k))};
 const resolveCenter=raw=>{
  const v=String(raw||'').split(/,\s*(?=[A-ZÁÉÍÓÚ])/)[0].trim();if(!v)return '';
  const c=findCenter(v);if(c)return c.name;
  if(createCenters){const id=uid();db.centers.push({id,code:'',tipo:'',name:v,town:'',phone:'',email:'',address:'',director:'',secretary:''});db.followup[id]={};newCenters++;return v}
  return v;
 };
 if(target==='centers'){
  for(const row of n.rows){
   const name=get(row,'name');if(!name){skipped++;continue}
   const code=get(row,'code');
   const ex=db.centers.find(c=>normTxt(c.name)===normTxt(name)||(code&&String(c.code)===code));
   const vals=Object.fromEntries(IMPORT_TARGETS.centers.fields.map(([k])=>[k,get(row,k)]));
   if(ex){if(updateCenters){let ch=false;for(const [k,v] of Object.entries(vals))if(v&&!ex[k]){ex[k]=v;ch=true}if(ch)updated++;else skipped++}else skipped++;continue}
   let id=code||uid();if(db.centers.some(c=>c.id===id))id=uid();
   const fullName=vals.tipo&&!normTxt(name).startsWith(normTxt(vals.tipo)+' ')?vals.tipo+' '+name:name;
   db.centers.push({id,code,name:fullName,tipo:vals.tipo,town:vals.town,phone:vals.phone,email:vals.email,address:vals.address,director:vals.director,secretary:vals.secretary});
   db.followup[id]={};created++;
  }
 }else if(target==='actions'){
  const seen=new Set(db.actions.map(a=>normTxt([a.date,a.center,a.subject].join('|'))));
  for(const row of n.rows){
   const rawDate=get(row,'date'),d=parseDateAny(rawDate);if(rawDate&&!d)badDates++;
   const [mode,modeNote]=normMode(get(row,'mode'));
   const subject=get(row,'subject'),center=resolveCenter(get(row,'center'));
   const details=[modeNote?`Medio indicado en Notion: ${modeNote}`:'',get(row,'details'),extraText(row)].filter(Boolean).join('\n\n');
   if(!subject&&!details&&!d){skipped++;continue}
   const key=normTxt([d,center,subject].join('|'));
   if(skipDup&&seen.has(key)){skipped++;continue}
   seen.add(key);
   db.actions.push({id:uid(),date:d,time:get(row,'time')||timeFrom(rawDate),mode,center,student:get(row,'student'),subject,details,action:get(row,'action'),finalizada:map.finalizada!==undefined&&parseDone(get(row,'finalizada')),createdAt:localIso(d,get(row,'time')||timeFrom(rawDate))||nowIso(),updatedAt:'',updates:[],source:'csv'});
   created++;
  }
 }else{
  const months=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const seen=new Set(db.visits.map(v=>normTxt(v.date+'|'+v.center)));
  for(const row of n.rows){
   const rawDate=get(row,'date'),d=parseDateAny(rawDate);if(rawDate&&!d)badDates++;
   const center=resolveCenter(get(row,'center'));if(!center&&!d){skipped++;continue}
   const key=normTxt(d+'|'+center);if(skipDup&&seen.has(key)){skipped++;continue}seen.add(key);
   db.visits.push({id:uid(),center,date:d,month:d?months[Number(d.slice(5,7))-1]:'',obs:[get(row,'obs'),extraText(row)].filter(Boolean).join('\n\n')});
   created++;
  }
 }
 save();closeModal();
 alert(`Importación terminada.\n\nNuevos registros: ${created}${updated?`\nCentros completados: ${updated}`:''}${newCenters?`\nFichas de centro creadas: ${newCenters}`:''}${skipped?`\nFilas omitidas: ${skipped}`:''}${badDates?`\nFechas no reconocidas (quedaron vacías): ${badDates}`:''}`);
 nav(target==='actions'?'registro':target==='centers'?'centros':'visitas');
}

const ACTION_MODES=['Correo electrónico','Teléfono','Presencial','REXEL','Otro'];
function nowIso(){return new Date().toISOString()}
function todayIso(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateTime(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function localIso(d,t){if(!d)return '';const x=new Date(`${d}T${t||'00:00'}`);return isNaN(x)?'':x.toISOString()}
function stopEv(e){e.preventDefault();e.stopPropagation()}
/* ---------- Cursos escolares (1 de septiembre a 31 de agosto) ---------- */
function courseOf(v){
 if(!v)return '';
 let y,m;const x=String(v).match(/^(\d{4})-(\d{2})/);
 if(x){y=+x[1];m=+x[2]}else{const d=new Date(v);if(isNaN(d))return '';y=d.getFullYear();m=d.getMonth()+1}
 const s=m>=9?y:y-1;return `${s}/${String((s+1)%100).padStart(2,'0')}`;
}
function currentCourse(){return courseOf(todayIso())}
function normCourse(v){const m=String(v||'').trim().match(/^(\d{4})\s*[\/\-]\s*(\d{2}|\d{4})$/);if(!m)return '';const a=+m[1],b=+m[2]%100;return (a+1)%100===b?`${a}/${String(b).padStart(2,'0')}`:''}
function courseList(dates,extra=[]){return [...new Set([currentCourse(),...extra,...dates.map(courseOf)].filter(Boolean))].sort().reverse()}
function courseSelect(id,courses,sel,onchange){return `<select id="${id}" class="select" aria-label="Curso escolar" onchange="${onchange}">${courses.map(k=>`<option value="${k}" ${k===sel?'selected':''}>Curso ${k}${k===currentCourse()?' (actual)':''}</option>`).join('')}<option value="*" ${sel==='*'?'selected':''}>Todos los cursos</option></select>`}
function inCourse(v,course){return course==='*'||courseOf(v)===course}
const centerCourseSel={};
function getCenterCourse(cid,kind){return centerCourseSel[cid+'.'+kind]||currentCourse()}

 db.centers.forEach(c=>{
  if(!c.tipo){const m=String(c.name||'').match(/^([A-Z]{2,6})\s/);if(m&&APP_TIPOS.includes(m[1]))c.tipo=m[1]}
  if('docUrl' in c)delete c.docUrl;
 });

/* ---------- Pegar actuación preparada por Claude ---------- */
const PASTE_KEYS={'fecha':'date','fecha de la actuacion':'date','hora':'time','medio':'mode','medio de comunicacion':'mode','centro':'center','codigo':'code','codigo del centro':'code','persona implicada':'student','persona':'student','persona implicada / alumno/a':'student','alumno/a':'student','alumno':'student','alumna':'student','alumnado':'student','asunto':'subject','detalles':'details','actuacion realizada':'action','actuacion realizada / respuesta':'action','respuesta':'action','estado':'status','finalizada':'status'};
function parsePastedAction(text){
 const out={};let cur=null;
 for(const raw of String(text).replace(/\r/g,'').split('\n')){
  if(/^\s*```/.test(raw))continue;
  const line=raw.replace(/^\s*[-*>]+\s*/,'').replace(/\*\*/g,'');
  const m=line.match(/^([A-Za-zÁÉÍÓÚÜáéíóúüñÑ/ .]{3,40}):\s*(.*)$/);
  const key=m&&PASTE_KEYS[normTxt(m[1]).replace(/\s+/g,' ')];
  if(key){cur=key;out[key]=m[2].trim();continue}
  if(!cur&&normTxt(line)==='actuacion')continue;
  if(cur==='details'||cur==='action')out[cur]=(out[cur]?out[cur]+'\n':'')+raw.trimEnd();
 }
 for(const k in out)out[k]=String(out[k]).replace(/^\n+|\s+$/g,'');
 return out;
}
function matchCenter(name,code){
 if(code){const c=db.centers.find(c=>String(c.code).trim()===String(code).trim());if(c)return c}
 const n=normTxt(name).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();if(!n)return null;
 const bare=s=>normTxt(s).replace(/[^a-z0-9 ]/g,' ').replace(/\b(ies|ceip|cpi|cra|eei|cpr|cfea|cee|cifp|eoi|epa|plurilingue|de|do|da|das|dos|o|a)\b/g,' ').replace(/\s+/g,' ').trim();
 return db.centers.find(c=>normTxt(c.name).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()===n)
  ||db.centers.find(c=>bare(c.name)&&bare(c.name)===bare(name))
  ||db.centers.filter(c=>bare(c.name)&&(bare(c.name).includes(bare(name))||bare(name).includes(bare(c.name)))).sort((a,b)=>b.name.length-a.name.length)[0]||null;
}

 return `Cuando te pida preparar una actuación para mi aplicación de registro, devuélvela SOLO en este formato, dentro de un bloque de código y sin texto adicional dentro del bloque. Usa solo iniciales para el alumnado y las demás personas implicadas.

ACTUACIÓN
Fecha: DD/MM/AAAA
Medio: Correo electrónico | Teléfono | Presencial | REXEL | Otro
Centro: nombre exacto de la lista de abajo

Persona implicada: iniciales o vacío
Asunto: una sola línea
Detalles: texto; puede ocupar varias líneas
Actuación realizada: texto; puede ocupar varias líneas

Mis centros:
${centers||'- (todavía no hay centros registrados)'}`;
}

function pasteActionStart(){
 openModal('Pegar actuación de Claude',`<p style="margin-top:0">Pega aquí el bloque que te ha preparado Claude. Se abrirá el formulario relleno para que lo revises antes de guardar.</p>
 <div class="toolbar"><button type="button" class="btn" onclick="pasteFromClipboard()">Pegar del portapapeles</button><button type="button" class="btn" onclick="copyClaudeInstructions()">Copiar instrucciones para Claude</button></div>
 <textarea id="pasteText" class="textarea" style="min-height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px" placeholder="ACTUACIÓN&#10;Fecha: 28/09/2026&#10;Medio: Teléfono&#10;Centro: …&#10;Asunto: …&#10;Detalles: …"></textarea>
 <p class="muted" style="font-size:12px">Las instrucciones incluyen el formato y la lista de tus centros (nombre y código) para que Claude los escriba igual que en la aplicación.</p>`,()=>{

  const c=matchCenter(p.center,p.code);

 });
 document.getElementById('modalSave').textContent='Continuar';
}

/* Bloques «DOTACIÓN DE PROFESORADO» preparados por Claude (uno o varios) */
function parseDotBlocks(text){
 const blocks=[];let cur=null,lastKey='';
 String(text||'').replace(/\r/g,'').replace(/^```.*$/gm,'').split('\n').forEach(line=>{
  const t=line.trim();
  if(/^DOTACI[ÓO]N( DE)? PROFESORADO/i.test(t)){cur={notas:''};blocks.push(cur);lastKey='';return}
  if(!cur)return;
  if(/^FIN$/i.test(t)){cur=null;return}
  const m=t.match(/^([^:]{2,40}):\s*(.*)$/);
  const key=m?normTxt(m[1]):'';
  const pairs=v=>{const o={};v.split(/[;,]/).forEach(p=>{const q=p.trim().match(/^([A-Za-z]{2,4})(?:\s+0\d\d(?=[\s=:]))?\s*[=:]?\s*(-?\d+)$/);if(q)o[q[1].toUpperCase()]=+q[2]});return o};
  if(m&&/^codigo/.test(key)){cur.code=m[2].replace(/\s/g,'');lastKey=''}
  else if(m&&/^centro/.test(key)){cur.center=m[2].trim();lastKey=''}
  else if(m&&/^curso/.test(key)){cur.course=normCourse(m[2]);lastKey=''}
  else if(m&&/^fecha/.test(key)){cur.fecha=parseDateAny(m[2])||'';lastKey=''}
  else if(m&&/^unidades/.test(key)){const o=pairs(m[2]);if('UEI' in o)cur.uei=o.UEI;if('UEP' in o)cur.uep=o.UEP;lastKey=''}
  else if(m&&/^catalogo/.test(key)){cur.cat=pairs(m[2]);lastKey=''}
  else if(m&&/^(presencia|reales|real)/.test(key)){cur.real=pairs(m[2]);lastKey=''}
  else if(m&&/^notas?/.test(key)){cur.notas=m[2].trim();lastKey='notas'}
  else if(lastKey==='notas'&&t)cur.notas+=(cur.notas?'\n':'')+t;
 });
 return blocks.filter(b=>b.cat||b.real);
}
function pasteDotStart(){
 openModal('Pegar dotación de profesorado',`<p style="margin-top:0">Pega aquí uno o varios bloques «DOTACIÓN DE PROFESORADO» preparados por Claude. Cada bloque se guarda en su centro (por el código) y en su curso.</p>
 <div class="toolbar"><button type="button" class="btn" onclick="pasteDotClipboard()">Pegar del portapapeles</button></div>
 <textarea id="dotPaste" class="textarea" style="min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px" placeholder="DOTACIÓN DE PROFESORADO&#10;Código: …&#10;Curso: 2026/27&#10;Unidades: UEI 5; UEP 14&#10;Catálogo+Habilitadas: EI 6; EP 13; …&#10;Presencia en centro: EI 6; EP 12; …&#10;FIN"></textarea>`,()=>{
  const blocks=parseDotBlocks(document.getElementById('dotPaste').value);
  if(!blocks.length){alert('No reconozco el formato. El bloque debe empezar por «DOTACIÓN DE PROFESORADO» y tener las líneas «Catálogo+Habilitadas» y «Presencia en centro».');return}
  const ok=[],bad=[];
  blocks.forEach(b=>{const c=matchCenter(b.center,b.code);if(!c||!b.course){bad.push(`${b.center||b.code||'Sin centro'}${b.course?'':' (sin curso)'}`);return}ok.push([c,b])});
  if(!ok.length){alert('No encuentro en tu registro ninguno de los centros:\n'+bad.join('\n'));return}

/* Lectura de ZIP y ODT sin bibliotecas externas */
function zipList(buf){
 const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error('El archivo no es un ZIP válido.');
 const n=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);const out=[];
 for(let k=0;k<n;k++){
  if(dv.getUint32(off,true)!==0x02014b50)break;
  const flag=dv.getUint16(off+8,true),method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nlen=dv.getUint16(off+28,true),xlen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),loc=dv.getUint32(off+42,true);
  const nb=u.subarray(off+46,off+46+nlen);let name;try{name=new TextDecoder(flag&0x800?'utf-8':'utf-8',{fatal:true}).decode(nb)}catch(_){name=String.fromCharCode(...nb)}
  const start=loc+30+dv.getUint16(loc+26,true)+dv.getUint16(loc+28,true);
  out.push({name,method,data:u.subarray(start,start+csize)});off+=46+nlen+xlen+clen;
 }
 return out;
}
async function zipRead(entry){
 if(entry.method===0)return entry.data;
 if(entry.method!==8)throw new Error('Formato de compresión no admitido.');
 if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede descomprimir archivos. Actualiza el navegador (en el iPhone, iOS 16.4 o posterior).');
 const st=new Blob([entry.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
 return new Uint8Array(await new Response(st).arrayBuffer());
}
function odtNodeText(n){
 let t='';
 for(const ch of n.childNodes){
  if(ch.nodeType===3){t+=ch.nodeValue;continue}
  if(ch.nodeType!==1)continue;
  const ln=ch.localName;
  if(ln==='s')t+=' '.repeat(Number(ch.getAttribute('text:c')||ch.getAttributeNS?.('urn:oasis:names:tc:opendocument:xmlns:text:1.0','c')||1));
  else if(ln==='tab')t+=' ';
  else if(ln==='line-break')t+='\n';
  else if(ln==='frame'||ln==='note'||ln==='annotation')continue;
  else t+=odtNodeText(ch);
 }
 return t;
}
function odtParas(n){
 const r=[];
 (function walk(x){for(const ch of x.childNodes){if(ch.nodeType!==1)continue;if(ch.localName==='p'||ch.localName==='h'){const t=odtNodeText(ch).replace(/[ \t\u00a0]+/g,' ').trim();if(t)r.push(t)}else if(ch.localName!=='table')walk(ch)}})(n);
 return r;
}
function odtTable(tb){
 const rows=[];
 (function walk(x){for(const ch of x.childNodes){if(ch.nodeType!==1)continue;
  if(ch.localName==='table-row'){const r=[];for(const cell of ch.childNodes){if(cell.nodeType!==1||cell.localName!=='table-cell')continue;
    const g=a=>Number(cell.getAttribute('table:'+a)||1),ps=[...cell.getElementsByTagName('*')].filter(e=>e.localName==='p');
    r.push({x:odtParas(cell).join('\n'),cs:g('number-columns-spanned'),rs:g('number-rows-spanned'),hd:ps.length>0&&ps.every(e=>/Head/.test(e.getAttribute('text:style-name')||''))})}
   if(r.length)rows.push(r)}
  else if(/^table-(header-rows|rows|row-group)$/.test(ch.localName))walk(ch)}})(tb);
 return rows;
}
function parseFichaODT(xml){
 const doc=new DOMParser().parseFromString(xml,'application/xml');
 const body=[...doc.getElementsByTagName('*')].find(n=>n.localName==='text'&&n.parentNode?.localName==='body');
 if(!body)throw new Error('No se encuentra el texto del documento.');
 const blocks=[],meta={};
 const isCaps=t=>t.length<70&&/[A-ZÁÉÍÓÚÑ]/.test(t)&&t===t.toUpperCase()&&!/^\*/.test(t)&&!/:/.test(t);
 (function walk(x){for(const n of x.childNodes){if(n.nodeType!==1)continue;const ln=n.localName;
  if(ln==='p'||ln==='h'){const t=odtNodeText(n).replace(/[ \t\u00a0]+/g,' ').trim();if(!t)continue;
   if(!blocks.length&&!meta.started&&/^INFORME$/i.test(t))continue;
   const st=n.getAttribute('text:style-name')||'';
   if(/SectionOfficial/.test(st)||(/^\d+\.\s/.test(t)&&isCaps(t.replace(/^\d+\.\s*/,''))))blocks.push({t:'h',x:t});
   else if(/SubOfficial/.test(st)||isCaps(t))blocks.push({t:'s',x:t});
   else blocks.push({t:'p',x:t,n:/^(Note|Muted)/.test(st)||/^\*|^AVISO/i.test(t)});}
  else if(ln==='table'){const rows=odtTable(n).filter(r=>r.some(c=>c.x));if(!rows.length)continue;
   const kv=rows.every(r=>r.length===2&&/:\s*$/.test(r[0].x));
   if(kv){const pairs=rows.map(r=>[r[0].x,r[1].x]);pairs.forEach(([a,v])=>{meta[a.replace(/:\s*$/,'').trim().toUpperCase()]=v});
    if(pairs.some(([a])=>/^ASUNTO/i.test(a)))continue;
    blocks.push({t:'kv',rows:pairs});}
   else{const styled=rows.some(r=>r.some(c=>c.hd));const head=styled?rows[0].every(c=>c.hd||!c.x):(rows.length>1&&!rows[0].some(c=>/^\d/.test(c.x))&&rows.slice(1).some(r=>r.some(c=>/^\d+$/.test(c.x))));
    blocks.push({t:'tb',head,rows:rows.map(r=>r.map(({x,cs,rs})=>({x,cs,rs})))});}}
  else if(ln==='list'||ln==='section'||ln==='list-item')walk(n);}})(body);
 const cm=String(meta['CENTRO']||'').match(/^\s*(\d{6,9})\s*[-–·]\s*(.+)$/);
 return {code:cm?cm[1]:'',name:cm?cm[2].trim():String(meta['CENTRO']||'').trim(),course:normCourse(meta['CURSO']||'')||'',date:meta['DATA']||'',inspector:meta['INSPECTOR/A']||'',blocks};
}
async function fichaFromODT(bytes,file){
 const ents=zipList(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength));
 const ce=ents.find(e=>e.name==='content.xml');if(!ce)throw new Error('No parece una ficha ODT.');

async function importFichasFiles(e){
 const files=[...e.target.files];if(!files.length)return;

 for(const file of files){
  try{
   const bytes=new Uint8Array(await file.arrayBuffer());
   if(/\.odt$/i.test(file.name)){fichas.push(await fichaFromODT(bytes,file.name));continue}
   for(const en of zipList(bytes.buffer)){
    if(!/\.odt$/i.test(en.name)||/(^|\/)(__MACOSX|\.)/.test(en.name))continue;
    const nm=en.name.split('/').pop();
    try{fichas.push(await fichaFromODT(await zipRead(en),nm))}catch(err){errors.push(nm+': '+err.message)}

 }).filter((p,i,arr)=>!p.cid||!arr.slice(i+1).some(q=>q.cid===p.cid&&q.course===p.course))

/* ---------- Importación de la carpeta completa de Notion ---------- */
const stripNotionId=n=>String(n).replace(/\.(md|csv)$/i,'').replace(/_all$/i,'').replace(/\s+[0-9a-f]{32}$/i,'').trim();
const normTitle=s=>normTxt(s).replace(/[^a-z0-9]/g,'');
const baseName=p=>p.split('/').pop();
const dirName=p=>p.split('/').slice(0,-1).join('/');
function cleanNotionMd(text){
 let L=String(text).replace(/\r/g,'').split('\n'),title='';
 if(L[0]&&/^#\s+/.test(L[0])){title=L[0].replace(/^#\s+/,'').trim();L=L.slice(1)}
 while(L.length&&!L[0].trim())L.shift();
 const props={};let i=0;
 while(i<L.length&&i<30&&/^[^:\n\[\]]{1,40}:\s/.test(L[i])&&!/^https?:/i.test(L[i])){const m=L[i].match(/^([^:]{1,40}):\s*(.*)$/);props[normTxt(m[1])]=m[2].trim();i++}
 if(i&&(i===L.length||!L[i].trim()))L=L.slice(i);
 const body=L.filter(l=>!/^\s*\[[^\]]*\]\([^)]*\.(md|csv)\)\s*$/i.test(l))
  .map(l=>l.replace(/\[([^\]]*)\]\([^)]*\.(md|csv)\)/gi,'$1').replace(/\[([^\]]*)\]\((https?:[^)]*)\)/gi,'$1 ($2)'))
  .join('\n').replace(/\n{3,}/g,'\n\n').trim();
 return {title,props,body};
}
function colIndex(headers,names){
 const h=headers.map(x=>normTxt(x));
 for(const n of names){const i=h.indexOf(n);if(i>=0)return i}
 for(const n of names){const i=h.findIndex(x=>x.includes(n));if(i>=0)return i}
 return -1;
}
